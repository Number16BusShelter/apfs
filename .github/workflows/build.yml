name: Build complete libfsapfs ARM64 toolkit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: libyal/libfsapfs
          ref: main
          path: source
          persist-credentials: false

      - name: Install build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install autoconf automake libtool gettext pkg-config openssl@3
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Try installing macFUSE development support
        run: |
          set -euo pipefail
          # Only on the disposable GitHub runner, not the recovery Mac.
          if brew install --cask macfuse; then
            echo 'macFUSE installation completed'
          else
            echo 'macFUSE unavailable; mounting may be disabled'
          fi
          ls -la /usr/local/include/fuse /usr/local/include/osxfuse /usr/local/lib/pkgconfig 2>/dev/null || true
          pkg-config --modversion fuse 2>/dev/null || true

      - name: Prepare identical build trees
        run: |
          set -euo pipefail
          cp -R source normal-src
          cp -R source debug-src
          mkdir -p dist/normal/{bin,lib,include} dist/debug/{bin,lib,include}
          git -C source rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cp source/COPYING source/COPYING.LESSER source/README dist/

      - name: Build normal and debug tools and libraries
        run: |
          set -euo pipefail
          OPENSSL="$(brew --prefix openssl@3)"
          export CPPFLAGS="-I${OPENSSL}/include"
          export LDFLAGS="-L${OPENSSL}/lib"
          export PKG_CONFIG_PATH="${OPENSSL}/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          FUSE_FLAG='--with-libfuse=no'
          if pkg-config --exists fuse || \
             [ -f /usr/local/include/osxfuse/fuse/fuse.h ] || \
             [ -f /usr/local/include/fuse/fuse.h ]; then
            FUSE_FLAG='--with-libfuse=yes'
          fi
          echo "FUSE configuration requested: $FUSE_FLAG" | tee dist/FUSE_STATUS.txt

          for variant in normal debug; do
            (
              cd "${variant}-src"
              ./synclibs.sh
              ./autogen.sh

              if [ "$variant" = normal ]; then
                DEBUG_FLAG='--disable-debug-output'
              else
                DEBUG_FLAG='--enable-debug-output'
              fi

              ./configure \
                --enable-shared=yes \
                --enable-static=yes \
                --enable-verbose-output \
                "$DEBUG_FLAG" \
                "$FUSE_FLAG" | tee "../dist/${variant}/configure.log"

              make -j3

              OUT="../dist/${variant}"
              for tool in fsapfsinfo fsapfsmount; do
                FOUND=''
                for candidate in \
                  "fsapfstools/.libs/${tool}" \
                  "fsapfstools/${tool}"; do
                  if [ -f "$candidate" ] && \
                     file "$candidate" | grep -Eq 'Mach-O.*arm64'; then
                    FOUND="$candidate"
                    break
                  fi
                done
                if [ -z "$FOUND" ]; then
                  echo "Missing ARM64 executable: ${tool} (${variant})" >&2
                  find fsapfstools -name "*${tool}*" -exec file {} \;
                  exit 1
                fi
                cp "$FOUND" "${OUT}/bin/${tool}"
                chmod +x "${OUT}/bin/${tool}"
              done

              LIB_A="$(find libfsapfs/.libs -maxdepth 1 -type f -name 'libfsapfs.a' -print -quit)"
              test -n "$LIB_A"
              cp "$LIB_A" "${OUT}/lib/libfsapfs.a"

              DYLIB_COUNT=0
              for library in libfsapfs/.libs/libfsapfs*.dylib; do
                [ -e "$library" ] || continue
                cp -L "$library" "${OUT}/lib/$(basename "$library")"
                DYLIB_COUNT=$((DYLIB_COUNT + 1))
              done
              if [ "$DYLIB_COUNT" -eq 0 ]; then
                echo "Missing shared libfsapfs dylib (${variant})" >&2
                exit 1
              fi

              cp -R include/. "${OUT}/include/"
              file "${OUT}/bin/fsapfsinfo" \
                   "${OUT}/bin/fsapfsmount" \
                   "${OUT}"/lib/*.dylib
            )
          done

      - name: Bundle dynamic dependencies and verify both variants
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          from pathlib import Path
          import os
          import shutil
          import subprocess

          def cmd(*args):
              subprocess.run(args, check=True)

          def output(*args):
              return subprocess.check_output(args, text=True)

          def dependencies(path):
              # A dylib's own install name appears in otool -L.
              # It is not an external dependency.
              lines = output('otool', '-L', str(path)).splitlines()[1:]
              return [
                  line.strip().split(' (', 1)[0]
                  for line in lines if line.strip()
              ]

          def own_install_name(path):
              if path.suffix != '.dylib':
                  return None
              lines = output('otool', '-D', str(path)).splitlines()
              return lines[1].strip() if len(lines) > 1 else None

          def resolve_source(dep, current, bin_dir, lib_dir):
              name = Path(dep).name
              candidates = [lib_dir / name]

              if dep.startswith('@loader_path/'):
                  candidates.insert(
                      0, current.parent / dep[len('@loader_path/'):]
                  )
              elif dep.startswith('@executable_path/'):
                  candidates.insert(
                      0, bin_dir / dep[len('@executable_path/'):]
                  )
              elif dep.startswith('/') or not dep.startswith('@'):
                  candidates.insert(0, Path(dep))

              candidates.extend([
                  Path('/opt/homebrew/lib') / name,
                  Path('/opt/homebrew/opt/openssl@3/lib') / name,
                  Path('/usr/local/lib') / name,
              ])

              for candidate in candidates:
                  if candidate.is_file():
                      return candidate

              raise RuntimeError(
                  f'Unable to locate dependency {dep} required by {current}'
              )

          for variant in ('normal', 'debug'):
              root = Path('dist') / variant
              bin_dir, lib_dir = root / 'bin', root / 'lib'

              executable_paths = [
                  bin_dir / 'fsapfsinfo',
                  bin_dir / 'fsapfsmount'
              ]

              queue = executable_paths + sorted(lib_dir.glob('*.dylib'))
              visited = set()

              while queue:
                  current = queue.pop(0)
                  if current in visited:
                      continue

                  visited.add(current)
                  own_id = own_install_name(current)

                  for dep in dependencies(current):
                      if dep == own_id:
                          # Ignore the dylib's own install-name entry.
                          continue

                      if dep.startswith(('/usr/lib/', '/System/Library/')):
                          continue

                      name = Path(dep).name
                      target = lib_dir / name

                      source = resolve_source(
                          dep, current, bin_dir, lib_dir
                      )

                      if not target.is_file():
                          shutil.copy2(os.path.realpath(source), target)

                      queue.append(target)

                      replacement = (
                          '@executable_path/../lib/'
                          if current in executable_paths
                          else '@loader_path/'
                      ) + name

                      if dep != replacement:
                          cmd(
                              'install_name_tool',
                              '-change',
                              dep,
                              replacement,
                              str(current)
                          )

                  if current.suffix == '.dylib':
                      cmd(
                          'install_name_tool',
                          '-id',
                          '@rpath/' + current.name,
                          str(current)
                      )

              # Sign only after finishing all install-name changes.
              for library in sorted(visited):
                  if library not in executable_paths:
                      cmd(
                          'codesign', '--force', '--sign', '-',
                          str(library)
                      )

              for executable in executable_paths:
                  cmd(
                      'codesign', '--force', '--sign', '-',
                      str(executable)
                  )
                  cmd('file', str(executable))
                  cmd('otool', '-L', str(executable))
                  cmd(str(executable.resolve()), '-V')
                  cmd(str(executable.resolve()), '-h')

              # Validate that no external non-system dependencies remain.
              for item in visited:
                  own_id = own_install_name(item)

                  for dep in dependencies(item):
                      if dep == own_id or dep.startswith(
                          ('/usr/lib/', '/System/Library/')
                      ):
                          continue

                      if not dep.startswith((
                          '@executable_path/../lib/',
                          '@loader_path/'
                      )):
                          raise RuntimeError(
                              f'Unportable dependency {dep} in {item}'
                          )

                      if not (lib_dir / Path(dep).name).is_file():
                          raise RuntimeError(
                              f'Missing packaged library {dep} for {item}'
                          )

              print(
                  f'{variant}: dependencies bundled, '
                  'both executables verified'
              )
          PYBUNDLE

          (
            cd dist
            find normal debug -type f \
              \( -name 'fsapfsinfo' -o -name 'fsapfsmount' \
                 -o -name 'libfsapfs.a' -o -name '*.dylib' \) \
              -print0 | xargs -0 shasum -a 256 > SHA256SUMS
          )

      - name: Upload complete toolkit
        uses: actions/upload-artifact@v4
        with:
          name: libfsapfs-complete-macos-arm64
          path: dist/
          retention-days: 30
