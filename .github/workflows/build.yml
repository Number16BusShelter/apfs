name: Build libfsapfs ARM64 (normal + debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout libfsapfs
        uses: actions/checkout@v4
        with:
          repository: libyal/libfsapfs
          ref: main
          path: libfsapfs-normal
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool gettext pkg-config openssl@3
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Create isolated source trees
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cp -R libfsapfs-normal libfsapfs-debug
          mkdir -p dist/normal dist/debug
          git -C libfsapfs-normal rev-parse HEAD > dist/SOURCE_COMMIT.txt
          printf '%s\n' 'normal: debug output disabled' 'debug: debug output enabled' > dist/BUILD_VARIANTS.txt

      - name: Build normal and debug variants
        run: |
          set -euo pipefail
          OPENSSL="$(brew --prefix openssl@3)"
          export CPPFLAGS="-I${OPENSSL}/include"
          export LDFLAGS="-L${OPENSSL}/lib"
          export PKG_CONFIG_PATH="${OPENSSL}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          for variant in normal debug; do
            (
              cd "libfsapfs-${variant}"
              ./synclibs.sh
              ./autogen.sh
              if [ "$variant" = normal ]; then
                debug_flag=--disable-debug-output
              else
                debug_flag=--enable-debug-output
              fi
              ./configure \
                --enable-shared=no \
                --with-libfuse=no \
                --enable-verbose-output \
                "$debug_flag"
              make -j3

              BINARY=""
              for candidate in fsapfstools/fsapfsinfo fsapfstools/.libs/fsapfsinfo; do
                if [ -f "$candidate" ] && file "$candidate" | grep -Eq 'Mach-O.*arm64'; then
                  BINARY="$candidate"
                  break
                fi
              done
              if [ -z "$BINARY" ]; then
                echo "No ARM64 Mach-O fsapfsinfo found for ${variant}" >&2
                find fsapfstools -name '*fsapfsinfo*' -exec file {} \;
                exit 1
              fi
              cp "$BINARY" "../dist/${variant}/fsapfsinfo"
              chmod 755 "../dist/${variant}/fsapfsinfo"
              echo "Variant ${variant}: ${BINARY}"
              file "../dist/${variant}/fsapfsinfo"
            )
          done
          cp libfsapfs-normal/COPYING libfsapfs-normal/COPYING.LESSER libfsapfs-normal/README dist/

      - name: Bundle required Homebrew libraries and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess

          def run(*args):
              subprocess.run(args, check=True)

          def dependencies(path):
              output = subprocess.check_output(['otool', '-L', str(path)], text=True)
              return [line.strip().split(' (', 1)[0] for line in output.splitlines()[1:]]

          for variant in ('normal', 'debug'):
              directory = Path('dist') / variant
              executable = directory / 'fsapfsinfo'
              queue = [executable]
              visited = set()
              while queue:
                  current = queue.pop(0)
                  if current in visited:
                      continue
                  visited.add(current)
                  for dep in dependencies(current):
                      if dep.startswith(('/usr/lib/', '/System/Library/')):
                          continue
                      if dep.startswith(('/opt/homebrew/', '/usr/local/Cellar/', '/usr/local/opt/')):
                          target = directory / Path(dep).name
                          if not target.exists():
                              shutil.copy2(os.path.realpath(dep), target)
                              queue.append(target)
                          prefix = '@executable_path/' if current == executable else '@loader_path/'
                          run('install_name_tool', '-change', dep, prefix + target.name, str(current))
                      elif dep.startswith(('@executable_path/', '@loader_path/')):
                          if not (directory / Path(dep).name).exists():
                              raise RuntimeError(f'Missing bundled dependency {dep} for {current}')
                      else:
                          raise RuntimeError(f'Unresolved dependency {dep} for {current}')
              for path in visited:
                  run('codesign', '--force', '--sign', '-', str(path))
              run('file', str(executable))
              run('otool', '-L', str(executable))
              run(str(executable.resolve()), '-V')
              run(str(executable.resolve()), '-h')
          PY
          (cd dist && shasum -a 256 normal/fsapfsinfo debug/fsapfsinfo > SHA256SUMS)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: libfsapfs-macos-arm64-dual
          path: dist/
          retention-days: 30
