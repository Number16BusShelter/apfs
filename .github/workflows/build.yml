name: Build complete libfsapfs ARM64 toolkit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: libyal/libfsapfs
          ref: main
          path: source
          persist-credentials: false

      - name: Install build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install autoconf automake libtool gettext pkg-config openssl@3
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Try installing macFUSE development support
        run: |
          set -euo pipefail
          # Only on GitHub's disposable runner, not the recovery Mac.
          # The kernel extension cannot be approved/loaded in hosted CI.
          if brew install --cask macfuse; then
            echo 'macFUSE installation completed'
          else
            echo 'macFUSE unavailable; mounting may be disabled'
          fi
          ls -la /usr/local/include/fuse /usr/local/include/osxfuse /usr/local/lib/pkgconfig 2>/dev/null || true
          pkg-config --modversion fuse 2>/dev/null || true

      - name: Prepare identical build trees
        run: |
          set -euo pipefail
          cp -R source normal-src
          cp -R source debug-src
          mkdir -p dist/normal/{bin,lib,include} dist/debug/{bin,lib,include}
          git -C source rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cp source/COPYING source/COPYING.LESSER source/README dist/

      - name: Build normal and debug tools and libraries
        run: |
          set -euo pipefail
          OPENSSL="$(brew --prefix openssl@3)"
          export CPPFLAGS="-I${OPENSSL}/include"
          export LDFLAGS="-L${OPENSSL}/lib"
          export PKG_CONFIG_PATH="${OPENSSL}/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          FUSE_FLAG='--with-libfuse=no'
          if pkg-config --exists fuse || \
             [ -f /usr/local/include/osxfuse/fuse/fuse.h ] || \
             [ -f /usr/local/include/fuse/fuse.h ]; then
            FUSE_FLAG='--with-libfuse=yes'
          fi
          echo "FUSE configuration requested: $FUSE_FLAG" | tee dist/FUSE_STATUS.txt

          for variant in normal debug; do
            (
              cd "${variant}-src"
              ./synclibs.sh
              ./autogen.sh

              if [ "$variant" = normal ]; then
                DEBUG_FLAG='--disable-debug-output'
              else
                DEBUG_FLAG='--enable-debug-output'
              fi

              ./configure \
                --enable-shared=yes \
                --enable-static=yes \
                --enable-verbose-output \
                "$DEBUG_FLAG" \
                "$FUSE_FLAG" | tee "../dist/${variant}/configure.log"

              make -j3

              OUT="../dist/${variant}"

              for tool in fsapfsinfo fsapfsmount; do
                FOUND=''
                for candidate in \
                  "fsapfstools/.libs/${tool}" \
                  "fsapfstools/${tool}"; do

                  if [ -f "$candidate" ] && \
                     file "$candidate" | grep -Eq 'Mach-O.*arm64'; then
                    FOUND="$candidate"
                    break
                  fi
                done

                if [ -z "$FOUND" ]; then
                  echo "Missing ARM64 executable: ${tool} (${variant})" >&2
                  find fsapfstools -name "*${tool}*" -exec file {} \;
                  exit 1
                fi

                cp "$FOUND" "${OUT}/bin/${tool}"
                chmod +x "${OUT}/bin/${tool}"
              done

              LIB_A="$(find libfsapfs/.libs -maxdepth 1 \
                -type f -name 'libfsapfs.a' -print -quit)"
              test -n "$LIB_A"
              cp "$LIB_A" "${OUT}/lib/libfsapfs.a"

              LIB_DYLIB="$(find libfsapfs/.libs -maxdepth 1 \
                -type f -name 'libfsapfs*.dylib' -print -quit)"

              if [ -z "$LIB_DYLIB" ]; then
                echo "Missing shared libfsapfs dylib (${variant})" >&2
                exit 1
              fi

              cp "$LIB_DYLIB" "${OUT}/lib/$(basename "$LIB_DYLIB")"
              cp -R include/. "${OUT}/include/"

              file "${OUT}/bin/fsapfsinfo" \
                   "${OUT}/bin/fsapfsmount" \
                   "${OUT}/lib/$(basename "$LIB_DYLIB")"
            )
          done

      - name: Bundle dynamic dependencies and verify both variants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import subprocess

          def invoke(*args):
              subprocess.run(args, check=True)

          def deps(path):
              out = subprocess.check_output(
                  ['otool', '-L', str(path)], text=True
              )
              return [
                  line.strip().split(' (', 1)[0]
                  for line in out.splitlines()[1:]
              ]

          for variant in ('normal', 'debug'):
              root = Path('dist') / variant
              bin_dir = root / 'bin'
              lib_dir = root / 'lib'

              queue = [
                  bin_dir / 'fsapfsinfo',
                  bin_dir / 'fsapfsmount'
              ]
              queue += list(lib_dir.glob('*.dylib'))
              visited = set()

              while queue:
                  item = queue.pop(0)
                  if item in visited:
                      continue
                  visited.add(item)

                  for dep in deps(item):
                      if dep.startswith((
                          '/usr/lib/',
                          '/System/Library/'
                      )):
                          continue

                      if dep.startswith((
                          '@executable_path/',
                          '@loader_path/'
                      )):
                          continue

                      if dep.startswith('@rpath/'):
                          target = lib_dir / Path(dep).name
                          if not target.exists():
                              raise RuntimeError(
                                  f'Unbundled rpath dependency: {dep} in {item}'
                              )
                      elif dep.startswith('/'):
                          target = lib_dir / Path(dep).name
                          if not target.exists():
                              if not os.path.isfile(dep):
                                  raise RuntimeError(
                                      f'Missing library: {dep} in {item}'
                                  )
                              shutil.copy2(os.path.realpath(dep), target)
                          queue.append(target)
                      else:
                          raise RuntimeError(
                              f'Unknown dependency: {dep} in {item}'
                          )

                      prefix = (
                          '@executable_path/../lib/'
                          if item.parent == bin_dir
                          else '@loader_path/'
                      )
                      invoke(
                          'install_name_tool', '-change',
                          dep, prefix + target.name, str(item)
                      )

              for dylib in lib_dir.glob('*.dylib'):
                  invoke(
                      'install_name_tool',
                      '-id',
                      '@rpath/' + dylib.name,
                      str(dylib)
                  )

              for item in visited:
                  invoke('codesign', '--force', '--sign', '-', str(item))

              for tool in ('fsapfsinfo', 'fsapfsmount'):
                  p = bin_dir / tool
                  invoke('file', str(p))
                  invoke('otool', '-L', str(p))
                  invoke(str(p.resolve()), '-V')
                  invoke(str(p.resolve()), '-h')
          PY

          (
            cd dist
            find normal debug -type f \
              \( -name 'fsapfsinfo' \
              -o -name 'fsapfsmount' \
              -o -name 'libfsapfs.a' \
              -o -name '*.dylib' \) \
              -print0 | xargs -0 shasum -a 256 > SHA256SUMS
          )

      - name: Upload complete toolkit
        uses: actions/upload-artifact@v4
        with:
          name: libfsapfs-complete-macos-arm64
          path: dist/
          retention-days: 30
